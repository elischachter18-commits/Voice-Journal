<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Journal">
<meta name="theme-color" content="#0D1219">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Voice Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
/* Layout: one column, everything within thumb reach. The prompt sits high, the mic sits low. Morning is a pale dawn, night is deep ink; wheat gold is the only accent. */
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --surface-2:#F4F6F8; --ink:#1B2430; --muted:#5D6B79; --line:#D8E0E6;
  --gold:#C98A12; --gold-ink:#1B1406; --gold-soft:#F7E7BF; --good:#2D8455; --bad:#B8443B;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif; --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
:root[data-mode="night"]{
  --bg:#0D1219; --surface:#161D27; --surface-2:#1C2531; --ink:#EEF1F5; --muted:#97A3B1; --line:#263140;
  --gold:#E8B44A; --gold-ink:#1B1406; --gold-soft:#3A3122; --good:#5CC48A; --bad:#E07A70; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 var(--f-body);min-height:100vh;transition:background .4s,color .4s;overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:10px}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,8vw,36px);line-height:1.12;font-weight:700}
h2{font-size:20px;font-weight:700}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.lede{color:var(--muted);margin:6px 0 0;font-size:17px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;padding:14px 22px;font-weight:700;font-size:17px;background:var(--ink);color:var(--bg);min-height:52px}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.small{min-height:40px;padding:8px 16px;font-size:15px}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn:active{transform:scale(.97)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:16px;padding:8px}

/* home */
.sessions{display:grid;gap:14px}
.session-btn{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:18px;min-height:96px}
.session-btn .ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold)}
.session-btn .ico svg{width:30px;height:30px}
.session-btn b{font-family:var(--f-display);font-size:22px;display:block}
.session-btn small{color:var(--muted);font-size:15px}
.session-btn.suggest{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.pill{font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.done{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.notice{border:1.5px dashed var(--gold);border-radius:18px;padding:14px 16px;font-size:16px;background:color-mix(in srgb,var(--gold) 8%,var(--surface))}

/* session */
.steps{display:flex;gap:6px}
.steps i{flex:1;height:5px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--gold)}
.prompt-top{display:flex;justify-content:space-between;align-items:center}
.mic-zone{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0}
.mic{position:relative;width:132px;height:132px;border-radius:50%;border:0;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;box-shadow:0 14px 34px -14px color-mix(in srgb,var(--gold) 80%,transparent)}
.mic svg{width:52px;height:52px}
.mic::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--gold);opacity:0}
.mic.rec::before{animation:ring 1.6s ease-out infinite}
.mic.rec{background:var(--ink);color:var(--bg)}
@keyframes ring{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.25);opacity:0}}
.mic-label{font-weight:700;font-size:16px;color:var(--muted)}
.live{min-height:3em;font-size:19px;line-height:1.5;color:var(--ink);background:var(--surface-2);border-radius:16px;padding:14px 16px;white-space:pre-wrap}
.live:empty{display:none}
.live .interim{color:var(--muted)}
textarea.type{width:100%;min-height:150px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);padding:14px;font-size:18px;resize:vertical}
.working{display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:700}
.dots i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:4px;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}
.err{color:var(--bad);font-weight:700;margin:0}

/* lists */
ul.clean{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.clean li{display:flex;align-items:flex-start;gap:10px;font-size:18px}
ul.clean li .t{flex:1;min-width:0;overflow-wrap:anywhere}
.ibtn{flex:none;width:40px;height:40px;margin:-6px -6px -6px 0;border:0;background:none;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ibtn svg{width:22px;height:22px}
.ibtn.on{color:var(--gold)}
.check{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface);color:transparent}
.check.on{background:var(--good);border-color:var(--good);color:#fff}
.check svg{width:18px;height:18px}
li.done .t{color:var(--muted);text-decoration:line-through}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:11px}
.label{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:10px 14px;font-weight:700;font-size:15px;display:inline-flex;gap:8px;align-items:center}
.chip.yes{border-color:var(--good);color:var(--good)}
.chip.no{border-color:var(--bad);color:var(--bad)}
.quote{font-size:19px;line-height:1.55;margin:0}
.big-quote{font-family:var(--f-display);font-size:24px;line-height:1.3;margin:0}

/* summary */
.summary{border-radius:24px;padding:22px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
.summary section{display:flex;flex-direction:column;gap:8px}

/* history */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.stat b{font-family:var(--f-display);font-size:34px;display:block;line-height:1.1}
.weeks{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:6px}
.weeks div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.weeks i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--gold);min-height:3px}
.weeks i.none{background:var(--line)}
.weeks small{font-size:12px;color:var(--muted);white-space:nowrap}
.day{text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.day b{font-family:var(--f-display);font-size:18px}
.day-body{display:flex;flex-direction:column;gap:14px;padding:4px 2px 8px}

/* settings */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:15px}
.field input{border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:14px;font-size:17px;width:100%}
.field small{color:var(--muted);font-size:14px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.bar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted);padding:6px 0}
.bar svg{width:25px;height:25px}
.bar button[aria-current="page"]{color:var(--gold)}
.in-session .bar{display:none}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:99px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="bar" id="bar" aria-label="Sections"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>

<script>
/* ============ storage: this phone only (localStorage, namespaced; the origin is shared with other apps) ============ */
const KEY = 'voiceJournal.v1', KEY_API = 'voiceJournal.apiKey';
const MODEL = 'claude-opus-5-5';
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
};
let db = ls.get(KEY, { days: {}, carry: [] });
const save = () => { if (!ls.set(KEY, db)) toast('Couldn’t save on this phone. Check storage space.'); };
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
const apiKey = () => { try { return localStorage.getItem(KEY_API) || ''; } catch { return ''; } };

/* ============ dates: a "journal day" runs 4am to 4am, so a late-night session counts for the day it closes ============ */
const pad = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const journalDay = () => isoDate(new Date(Date.now() - 4 * 3600e3));
const parseDay = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDay = (s, o = { weekday: 'long', month: 'long', day: 'numeric' }) => parseDay(s).toLocaleDateString('en-US', o);
const addDays = (s, n) => { const d = parseDay(s); d.setDate(d.getDate() + n); return isoDate(d); };
const dayRec = s => (db.days[s] = db.days[s] || {});

/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
const I = {
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2.5"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg>',
  starO: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  tick: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>',
  history: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>',
};

/* ============ Claude: tidy what was said into the step's shape, never adding to it ============ */
const SYSTEM = `You tidy up a person's spoken journal entries. Their words come from phone dictation, so expect filler words, false starts, repetition and misheard words.

Rules:
- Keep their words, voice and meaning. Fix filler, repetition and obvious dictation errors, and organize, but don't rewrite their style.
- Never add advice, commentary, encouragement, praise, questions or anything they didn't say.
- Never invent items. If they didn't mention something, leave it out (or use "unclear" where the format asks for it).
- Write in the first person, as they spoke.
- Reply with JSON only, in exactly the requested shape.`;
const arr = { type: 'array', items: { type: 'string' } };
const obj = (props) => ({ type: 'object', properties: props, required: Object.keys(props), additionalProperties: false });
const yn = { type: 'string', enum: ['yes', 'no', 'unclear'] };
const SPECS = {
  checkin: { schema: obj({ feeling: { type: 'string' } }), ask: 'This is their morning check-in on how they feel. Return their check-in as one to three clean sentences in "feeling".' },
  affirmations: { schema: obj({ affirmations: arr }), ask: 'These are their affirmations. Return each affirmation as its own short sentence, in their words.' },
  tasks: { schema: obj({ top3: arr, other: arr }), ask: 'These are the things they want to get done today. CURRENT LIST is what is already planned. Merge in what they said: add new tasks, drop any they say to drop, and keep the rest. Put the three most important in "top3" (most important first) — follow what they say is most important; if they don\'t say, keep CURRENT LIST\'s top 3. Everything else goes in "other". Each task is a short action phrase. No duplicates.' },
  intention: { schema: obj({ intention: { type: 'string' } }), ask: 'This is their one intention for the day. Return it as one clean sentence.' },
  done: { schema: obj({ done: { type: 'array', items: { type: 'integer' } } }), ask: 'Below is this morning\'s numbered task list. From what they said, return the numbers of the tasks they got done. Only include tasks they clearly say are done.' },
  wins: { schema: obj({ wins: arr }), ask: 'These are their wins: what they did well today. Return each win as its own short sentence.' },
  slipped: { schema: obj({ items: { type: 'array', items: obj({ what: { type: 'string' }, why: { type: 'string' } }) } }), ask: 'This is what slipped today and briefly why. Return each item with "what" slipped and "why" (empty string if they gave no reason).' },
  food: { schema: obj({ calories: yn, protein: yn, clean: yn, note: { type: 'string' } }), ask: 'This is their food check. Targets: about 2,500 calories, 180 to 200 g protein, no sugar and no alcohol. "calories": did they hit about 2,500? "protein": did they get 180 to 200 g? "clean": did they avoid sugar and alcohol entirely? Use "unclear" when they didn\'t say. "note": one short sentence with any details they gave (numbers, what they ate), or an empty string.' },
  tomorrow: { schema: obj({ tasks: arr }), ask: 'These are the things they want to get done tomorrow. Return each as a short action phrase, in the order they said them, no duplicates.' },
};
let sdk = null;
async function organize(step, said, context = '') {
  const key = apiKey();
  if (!key) throw Object.assign(new Error('no-key'), { code: 'no-key' });
  if (!sdk) {
    const mod = await import('https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.135.0/+esm');
    sdk = mod.default || mod.Anthropic;
  }
  const client = new sdk({ apiKey: key, dangerouslyAllowBrowser: true });
  const spec = SPECS[step];
  try {
    const res = await client.beta.messages.create({
      model: MODEL, max_tokens: 8000,
      betas: ['server-side-fallback-2026-07-01'], fallbacks: 'default',
      output_config: { effort: 'low', format: { type: 'json_schema', schema: spec.schema } },
      system: SYSTEM,
      messages: [{ role: 'user', content: `${spec.ask}${context ? `\n\n${context}` : ''}\n\nWHAT THEY SAID:\n${said}` }],
    });
    if (res.stop_reason === 'refusal') throw Object.assign(new Error('refused'), { code: 'refused' });
    const text = res.content.filter(b => b.type === 'text').map(b => b.text).join('');
    return JSON.parse(text);
  } catch (e) {
    if (e instanceof sdk.AuthenticationError || e instanceof sdk.PermissionDeniedError) e.code = 'bad-key';
    else if (e instanceof sdk.RateLimitError) e.code = 'busy';
    else if (e instanceof sdk.APIConnectionError) e.code = 'offline';
    throw e;
  }
}
const ERR = {
  'no-key': 'Add your Claude key in Settings to organize entries. Your words are saved as you said them.',
  'bad-key': 'Your Claude key didn’t work. Check it in Settings. Your words are saved as you said them.',
  busy: 'Claude is busy right now. Your words are saved; tap Organize again in a moment.',
  offline: 'No connection. Your words are saved; tap Organize again when you’re online.',
  refused: 'Claude couldn’t organize this one. Your words are saved as you said them.',
};
const errText = e => ERR[e && e.code] || 'Couldn’t organize that. Your words are saved; try Organize again.';

/* without Claude: keep their words, split into rough items so nothing is lost */
const roughItems = s => String(s).split(/(?<=[.!?])\s+|\n+|,?\s+\band then\b\s+/i).map(x => x.trim().replace(/^[-•\s]+/, '')).filter(Boolean);
function fallback(step, said, ctx) {
  const items = roughItems(said);
  switch (step) {
    case 'checkin': return { feeling: said.trim() };
    case 'affirmations': return { affirmations: items };
    case 'intention': return { intention: said.trim() };
    case 'tasks': { const all = [...ctx.top3, ...ctx.other, ...items]; return { top3: all.slice(0, 3), other: all.slice(3) }; }
    case 'done': return { done: [] };
    case 'wins': return { wins: items };
    case 'slipped': return { items: items.map(what => ({ what, why: '' })) };
    case 'food': return { calories: 'unclear', protein: 'unclear', clean: 'unclear', note: said.trim() };
    case 'tomorrow': return { tasks: items };
  }
}

/* ============ speech: iPhone's built-in recognition, kept alive through pauses; typing (with the keyboard mic) as backup ============ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const rec = { on: false, finalText: '', interim: '', r: null };
function startListening(onUpdate, onFail) {
  if (!SR) return onFail('unsupported');
  rec.on = true; rec.finalText = ''; rec.interim = '';
  const begin = () => {
    const r = new SR(); rec.r = r;
    r.lang = navigator.language || 'en-US'; r.continuous = true; r.interimResults = true;
    r.onresult = ev => {
      let interim = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const res = ev.results[i];
        if (res.isFinal) rec.finalText += (rec.finalText ? ' ' : '') + res[0].transcript.trim();
        else interim += res[0].transcript;
      }
      rec.interim = interim; onUpdate();
    };

/* ============ the routines ============ */
const MORNING = [
  { key: 'checkin', title: 'How are you feeling?', sub: 'A quick check-in. Say whatever’s true right now.' },
  { key: 'affirmations', title: 'Affirmations', sub: 'Say your affirmations for today.' },

let view = 'home', session = null; // session: { kind, day, step, phase: idle|listening|typing|working|review, said, error }

function startSession(kind) {

    const carry = (db.carry || []).map(text => ({ text, done: false }));
    s.tasks = { top3: carry.slice(0, 3), other: carry.slice(3) };
  }
  if (s.completedAt) s.step = steps(kind).length; // already finished: show the summary

}
const rec_ = () => db.days[session.day][session.kind];

// what Claude needs to see besides the words
function contextFor(step) {

  if (step === 'done') return `THIS MORNING'S TASKS:\n${allTasks(m).map((t, i) => `${i + 1}. ${t.text}`).join('\n') || '(none)'}`;
  return '';
}
const allTasks = m => { const t = tasksOf(m); return [...t.top3, ...t.other]; };

// fold a step's organized result into the day record
function apply(step, out) {
  const s = rec_();
  const m = (db.days[session.day] || {}).morning;
  switch (step) {
    case 'checkin': s.checkin = out.feeling; break;
    case 'affirmations': s.affirmations = [...(s.affirmations || []), ...out.affirmations]; break;
    case 'intention': s.intention = out.intention; break;

      const prev = new Map(allTasks(s).map(t => [t.text.toLowerCase(), t.done]));
      const mk = text => ({ text, done: prev.get(text.toLowerCase()) || false });
      s.tasks = { top3: out.top3.slice(0, 3).map(mk), other: [...out.top3.slice(3), ...out.other].map(mk) };

    case 'done': { const list = allTasks(m); out.done.forEach(n => { if (list[n - 1]) list[n - 1].done = true; }); s.reviewed = true; break; }

    case 'slipped': s.slipped = [...(s.slipped || []), ...out.items]; break;

/* history + stats */
function stats() {
  const done = s => { const d = db.days[s]; return !!(d && d.morning && d.morning.completedAt && d.night && d.night.completedAt); };
  let day = journalDay(), streak = 0;
  if (!done(day)) day = addDays(day, -1); // today still counts until it's over
  while (done(day)) { streak++; day = addDays(day, -1); }
  // Top 3 finished per week (weeks start Monday), last 6 weeks
  const weeks = [];
  const today = parseDay(journalDay()), monday = new Date(today); monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));
  for (let w = 5; w >= 0; w--) {
    const start = new Date(monday); start.setDate(monday.getDate() - 7 * w);
    let total = 0, fin = 0;
    for (let i = 0; i < 7; i++) { const s = new Date(start); s.setDate(start.getDate() + i); const m = (db.days[isoDate(s)] || {}).morning; tasksOf(m).top3.forEach(x => { total++; if (x.done) fin++; }); }
    weeks.push({ label: start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }), pct: total ? Math.round(fin / total * 100) : null });
  }
  return { streak, weeks };
}

  const s = session && rec_();
  if (b.dataset.del && s) { s[b.dataset.del].splice(+b.dataset.i, 1); save(); return render(); }
  if (b.dataset.deltask && s) { const t = tasksOf(s); (b.dataset.deltask === 'top' ? t.top3 : t.other).splice(+b.dataset.i, 1); save(); return render(); }
  if (b.dataset.star && s) {
    const t = tasksOf(s), i = +b.dataset.i;
    if (b.dataset.star === 'top') t.other.unshift(...t.top3.splice(i, 1));
    else { if (t.top3.length >= 3) t.other.push(t.top3.pop()); t.top3.push(...t.other.splice(i, 1)); }
    save(); return render();
  }
  if (b.dataset.toggle != null && session) { const m = db.days[session.day].morning, x = allTasks(m)[+b.dataset.toggle]; if (x) { x.done = !x.done; save(); render(); } return; }
  if (b.dataset.food && s && s.food) { const order = ['yes', 'no', 'unclear'], k = b.dataset.food; s.food[k] = order[(order.indexOf(s.food[k]) + 1) % 3]; save(); return render(); }
  const act = b.dataset.act;
  if (act === 'mic') {
    if (session.phase === 'listening') { const said = stopListening(); return handleSpeech(said); }
    session.phase = 'listening'; session.error = ''; render();
    startListening(() => { const el = $('#live'); if (el) el.innerHTML = liveHtml(); }, why => {
      session.phase = 'typing';
      session.error = why === 'unsupported' || why === 'ended'
        ? 'Voice recognition isn’t available here. Type below, or tap the microphone on your keyboard to dictate.'
        : 'Microphone access is off. Allow it in iPhone Settings, or type below and tap the keyboard’s microphone.';
      render(); const t = $('#typeBox'); if (t) t.focus();
      toast(session.error);
    });
    return;
  }
  if (act === 'type') { session.phase = 'typing'; render(); const t = $('#typeBox'); if (t) t.focus(); return; }
  if (act === 'cancel-type') { session.phase = 'idle'; return render(); }
  if (act === 'submit-type') return handleSpeech(($('#typeBox') || {}).value || '');
  if (act === 'next') return nextStep();
  if (act === 'redo') return redoStep();
  if (act === 'edit') { const st = rec_(); delete st.completedAt; session.step = 0; st.step = 0; session.phase = 'idle'; save(); return render(); }
  if (act === 'save-key') { const v = ($('#apiKey').value || '').trim(); try { v ? localStorage.setItem(KEY_API, v) : localStorage.removeItem(KEY_API); } catch {} toast(v ? 'Key saved on this phone' : 'Key removed'); return render(); }
  if (act === 'test-key') {
    toast('Testing…');
    try { await organize('intention', 'um so today I want to be uh patient with people'); toast('Your key works'); }
    catch (err) { toast(err.code === 'bad-key' ? 'That key didn’t work' : errText(err)); }
    return;
  }
  if (act === 'backup') {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify({ app: 'Voice Journal', exportedAt: new Date().toISOString(), data: db }, null, 1)], { type: 'application/json' }));
    a.download = `voice-journal-backup-${journalDay()}.json`; document.body.appendChild(a); a.click(); a.remove();
    return setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  }
  if (act === 'restore') return $('#restoreFile').click();
  if (act === 'erase') {
    if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = 'Tap again to erase everything'; setTimeout(() => { b.classList.remove('armed'); b.textContent = 'Erase everything'; }, 3500); return; }
    db = { days: {}, carry: [] }; save(); toast('Journal erased'); return render();
  }
});
$('#restoreFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { const j = JSON.parse(await f.text()); if (!j || !j.data || typeof j.data.days !== 'object') throw 0; db = { days: j.data.days, carry: j.data.carry || [] }; save(); toast('Backup restored'); render(); }
  catch { toast('That file isn’t a Voice Journal backup.'); }
});
// leave the app mid-recording: keep what was said
document.addEventListener('visibilitychange', () => { if (document.hidden && rec.on && session) { const said = stopListening(); if (said) handleSpeech(said); else { session.phase = 'idle'; render(); } } });

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
render();
</script>
</body>
